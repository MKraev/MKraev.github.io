---
layout: default
---
<section class="page-hero">
  <div class="container">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>

<div class="container page-body{% if page.prose %} prose narrow{% endif %}">
  {{ content }}
</div>

{% unless page.hide_contact_band %}{% include contact-band.html %}{% endunless %}
